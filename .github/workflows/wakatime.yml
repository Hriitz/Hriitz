name: WakaTime Weekly Stats

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Inject WakaTime stats into README
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          GH_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          API_BASE_URL:     https://wakatime.com/api
          SHOW_TITLE:       true
          SECTION_NAME:     waka
          BLOCKS:           "░▒▓█"
          CODE_LANG:        txt
          TIME_RANGE:       last_7_days
          LANG_COUNT:       5
          STOP_AT_OTHER:    true
          IGNORED_LANGUAGES: "Other"
          COMMIT_MESSAGE:   "chore: refresh WakaTime stats"
